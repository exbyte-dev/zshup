name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the scripts
        run: shellcheck install.sh tests/docker-test.sh tests/container-test.sh

  zshrc-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Parse the zshrc template
        run: zsh -n zshrc

  install:
    # The real test: a full install, then a second run to prove it changes
    # nothing. One job per distro so a failure points at the right one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:stable-slim
          - ubuntu:latest
          - fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install in ${{ matrix.image }}
        run: tests/docker-test.sh ${{ matrix.image }}
